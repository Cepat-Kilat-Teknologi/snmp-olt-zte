apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-olt-zte
  namespace: misindo-snmp-olt-zte-prod
  labels:
    app.kubernetes.io/name: snmp-olt-zte
    app.kubernetes.io/part-of: misindo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-olt-zte
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snmp-olt-zte
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: snmp-olt-zte
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: storage, operator: In, values: ["false"] }
      imagePullSecrets:
        - name: dockerhub-pull
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: snmp-olt-zte
          image: docker.io/cepatkilatteknologi/snmp-olt-zte:latest  # pin to a tag in production
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - secretRef:
                name: snmp-olt-zte-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
