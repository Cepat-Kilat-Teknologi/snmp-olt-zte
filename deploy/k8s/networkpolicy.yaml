apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snmp-olt-zte
  namespace: misindo-snmp-olt-zte-prod
  labels:
    app.kubernetes.io/name: snmp-olt-zte
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: snmp-olt-zte
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
    # Allow traffic from within the namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8081
    # Allow traffic from gateway namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: misindo-gateway-prod
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to OLT devices (SNMP)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 161
